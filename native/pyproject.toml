[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pokemoba_native"
version = "0.1.0"
description = "Optional Rust acceleration for the PokeMoba engine (pure-Python fallback in engine/)."
requires-python = ">=3.10"

[tool.maturin]
features = ["pyo3/extension-module"]
